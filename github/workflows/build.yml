name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir -p work app
          Z=$(ls *.zip 2>/dev/null | head -n1 || true)
          if [ -n "$Z" ]; then unzip -q "$Z" -d work; else cp -r . work/; fi
          WWW=$(find work -type d -name www -not -path "*/node_modules/*" | head -n1)
          test -f "$WWW/index.html" || { echo "ไม่พบ www/index.html"; exit 1; }
          cp -r "$WWW" app/www

      - name: Create Android project
        working-directory: app
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor-community/bluetooth-le@6
          npx cap init "RC Car" com.example.rccar --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Patch manifest (Bluetooth + landscape)
        working-directory: app
        run: |
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          perm='''<uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />
              <uses-feature android:name="android.hardware.bluetooth_le" android:required="false" />
              '''
          s=s.replace('<application',perm+'<application',1)
          s=s.replace('<activity','<activity android:screenOrientation="sensorLandscape"',1)
          open(p,'w').write(s)
          PY

      - name: Build debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: rc-car-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
